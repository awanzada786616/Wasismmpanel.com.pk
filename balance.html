<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Balance | RichWay SMM</title>
    
    <!-- Icons & Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --mint: #00e676;
            --mint-dark: #00c853;
            --bg: #f4f7f6;
            --white: #ffffff;
            --text: #333;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }

        /* --- HEADER & SIDEBAR (Same as Dashboard) --- */
        header { background: var(--white); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; position: sticky; top: 0; z-index: 1000; }
        .brand { font-size: 1.2rem; font-weight: 800; color: #3498db; }
        .menu-btn { background: #eee; padding: 10px; border-radius: 8px; color: var(--mint-dark); cursor: pointer; }

        .sidebar { position: fixed; top: 0; left: -300px; width: 280px; height: 100%; background: #fff; z-index: 2000; transition: 0.4s; box-shadow: 5px 0 15px rgba(0,0,0,0.1); padding: 30px 20px; }
        .sidebar.active { left: 0; }
        .side-item { display: flex; align-items: center; gap: 15px; padding: 15px; text-decoration: none; color: #444; font-weight: 600; border-radius: 10px; margin-bottom: 5px; }
        .side-item:hover { background: #f0fdf4; color: var(--mint-dark); }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1500; display: none; }
        .overlay.active { display: block; }

        /* Realistic CSS Lights */
        .lights-row { width: 100%; height: 40px; display: flex; justify-content: space-around; background: #fff; }
        .bulb { width: 12px; height: 12px; border-radius: 50%; margin-top: 15px; animation: swing 3s infinite alternate; transform-origin: top center; }
        .red { background: #ff4d4d; box-shadow: 0 0 10px #ff4d4d; }
        .green { background: #2ecc71; box-shadow: 0 0 10px #2ecc71; }
        .purple { background: #9b59b6; box-shadow: 0 0 10px #9b59b6; }
        @keyframes swing { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }

        /* --- BALANCE PAGE CONTENT --- */
        .container { max-width: 600px; margin: 20px auto; padding: 0 15px; }
        
        .current-bal-card { background: var(--mint); padding: 20px; border-radius: 12px; color: white; text-align: center; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(0,230,118,0.3); }
        .current-bal-card h2 { font-size: 2rem; }

        .payment-form { background: #fff; padding: 30px 20px; border-radius: 15px; border: 1px solid #eee; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 700; font-size: 0.85rem; margin-bottom: 8px; }
        .input-ctrl { width: 100%; padding: 14px; border: 1px solid #c8e6c9; border-radius: 10px; background: #f9f9f9; outline: none; font-size: 1rem; }

        /* DYNAMIC ADMIN BOX */
        .admin-details-box { 
            background: #fff8e1; border: 2px dashed #ffd54f; padding: 20px; border-radius: 12px; 
            margin-bottom: 25px; text-align: center; display: none; 
        }
        .admin-details-box img { width: 80px; margin-bottom: 10px; border-radius: 8px; }
        .admin-details-box h3 { color: #f57f17; font-size: 1.4rem; letter-spacing: 1px; }
        .admin-details-box p { font-size: 0.85rem; color: #555; margin-top: 10px; }

        .submit-btn { width: 100%; padding: 16px; background: var(--mint); color: white; border: none; border-radius: 10px; font-weight: 800; font-size: 1.1rem; cursor: pointer; transition: 0.3s; }
        .submit-btn:hover { background: var(--mint-dark); transform: scale(1.02); }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
    <div class="sidebar" id="sidebar">
        <h2>Menu</h2>
        <a href="dashboard.html" class="side-item"><i class="fas fa-plus-circle"></i> New Order</a>
        <a href="history.html" class="side-item"><i class="fas fa-history"></i> Order History</a>
        <a href="balance.html" class="side-item" style="background: #f0fdf4; color: var(--mint-dark);"><i class="fas fa-wallet"></i> Add Balance</a>
        <a href="#" class="side-item" style="margin-top: 50px; color: red;" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </div>

    <header>
        <div class="brand">RichWay SMM <i class="fas fa-check-circle" style="color:#3498db; font-size: 0.9rem;"></i></div>
        <div class="menu-btn" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
    </header>

    <div class="lights-row">
        <div class="bulb red"></div><div class="bulb green"></div><div class="bulb purple"></div>
        <div class="bulb red"></div><div class="bulb green"></div><div class="bulb purple"></div>
        <div class="bulb red"></div><div class="bulb green"></div><div class="bulb purple"></div>
    </div>

    <div class="container">
        <!-- CURRENT BALANCE -->
        <div class="current-bal-card">
            <p style="font-size: 0.9rem; opacity: 0.9;">Your Current Balance</p>
            <h2 id="my-balance">Rs 0.00</h2>
        </div>

        <!-- PAYMENT FORM -->
        <div class="payment-form">
            <h3 style="margin-bottom: 20px; text-align: center;">Deposit Funds</h3>

            <div class="form-group">
                <label>Select Payment Method</label>
                <select class="input-ctrl" id="method-select">
                    <option value="">-- Choose Method --</option>
                    <option value="easypaisa">EasyPaisa</option>
                    <option value="jazzcash">JazzCash</option>
                    <option value="binance">Binance (USDT)</option>
                </select>
            </div>

            <!-- DYNAMIC ADMIN INFO BOX -->
            <div class="admin-details-box" id="admin-info-box">
                <img id="method-logo" src="" alt="Logo">
                <p id="method-desc">Send payment to the number below:</p>
                <h3 id="admin-number">0300 0000000</h3>
                <p id="admin-note" style="color: red; font-weight: bold;"></p>
            </div>

            <div class="form-group">
                <label>Amount (PKR)</label>
                <input type="number" class="input-ctrl" id="amount" placeholder="Min: 100">
            </div>

            <div class="form-group">
                <label>Your Account Name / Number</label>
                <input type="text" class="input-ctrl" id="sender-info" placeholder="Name or Number you sent from">
            </div>

            <div class="form-group">
                <label>Transaction ID (TID)</label>
                <input type="text" class="input-ctrl" id="tid" placeholder="Enter 11 digit TID">
            </div>

            <button class="submit-btn" onclick="submitDeposit()">Submit Deposit Request</button>
        </div>
    </div>

    <!-- FIREBASE INTEGRATION -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, collection, addDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA44TLKBn93R8SxgmcVWAjr6wI3SQSTvM0",
            authDomain: "wasi-smm.firebaseapp.com",
            projectId: "wasi-smm",
            storageBucket: "wasi-smm.firebasestorage.app",
            messagingSenderId: "100481136940",
            appId: "1:100481136940:web:6dbb01efebc0774957d489."
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let paymentData = {};

        // UI Helpers
        window.toggleMenu = () => {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        // 1. Auth check & Balance load
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                onSnapshot(doc(db, "users", user.uid), (snap) => {
                    document.getElementById('my-balance').innerText = `Rs ${snap.data().balance.toLocaleString()}`;
                });
                loadAdminGateways();
            } else {
                window.location.href = "index.html";
            }
        });

        // 2. Load Gateways from Admin Panel
        function loadAdminGateways() {
            onSnapshot(doc(db, "settings", "payment_gateways"), (snap) => {
                if (snap.exists()) {
                    paymentData = snap.data();
                }
            });
        }

        // 3. Handle Method Selection Change
        document.getElementById('method-select').addEventListener('change', (e) => {
            const method = e.target.value;
            const box = document.getElementById('admin-info-box');
            
            if (method && paymentData[method]) {
                const data = paymentData[method];
                box.style.display = 'block';
                document.getElementById('method-logo').src = data.logoUrl;
                document.getElementById('admin-number').innerText = data.number;
                document.getElementById('admin-note').innerText = data.description;
            } else {
                box.style.display = 'none';
            }
        });

        // 4. Submit Deposit
        window.submitDeposit = async () => {
            const amount = document.getElementById('amount').value;
            const sender = document.getElementById('sender-info').value;
            const tid = document.getElementById('tid').value;
            const method = document.getElementById('method-select').value;

            if (!amount || !sender || !tid || !method) {
                return Swal.fire("Error", "Please fill all fields!", "error");
            }

            try {
                await addDoc(collection(db, "deposits"), {
                    uid: currentUser.uid,
                    userEmail: currentUser.email,
                    method: method,
                    amount: parseFloat(amount),
                    senderInfo: sender,
                    transactionId: tid,
                    status: "pending",
                    timestamp: new Date()
                });

                Swal.fire("Submitted!", "Your request is sent to Admin for approval.", "success")
                .then(() => { location.reload(); });

            } catch (error) {
                Swal.fire("Error", "Something went wrong!", "error");
            }
        }
    </script>
</body>
</html>
